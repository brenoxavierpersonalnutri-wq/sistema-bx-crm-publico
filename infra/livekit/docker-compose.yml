# headturbo-livekit — estúdio de lives do CRM: LiveKit (SFU + TURN), Egress (render/RTMP) e Redis.
# Instalado em /opt/headturbo-livekit na VPS. Só objetos com prefixo headturbo-livekit.
# Segredos fora do repositório: /etc/headturbo-livekit/livekit.env e /etc/headturbo-livekit/egress.yaml
# (root, 0600). Nada de segredo neste arquivo. Instalação: README.md (NÃO roda sozinho).
#
# Rede host para livekit/egress/redis: é o recomendado pelo LiveKit (WebRTC com 10 mil portas UDP
# publicadas por bridge fica lento e quebra o ICE). O ufw continua valendo para rede host — só as
# portas abertas no README chegam de fora; 7880 (sinalização) e 6380 (redis) ficam fechadas e o
# Caddy chega no 7880 pelo gateway da rede docker dele.
name: headturbo-livekit
services:
  redis:
    image: redis:7.4-alpine
    container_name: headturbo-livekit-redis
    labels:
      headturbo.kit: livekit
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6380", "--save", "", "--appendonly", "no", "--protected-mode", "yes"]
    mem_limit: 256m
    cpus: 0.5
    logging: { driver: json-file, options: { max-size: 5m, max-file: "3" } }

  livekit:
    image: livekit/livekit-server:v1.13.10
    container_name: headturbo-livekit-server
    labels:
      headturbo.kit: livekit
    restart: unless-stopped
    network_mode: host
    depends_on: [redis]
    command: ["--config", "/etc/livekit.yaml"]
    env_file:
      - /etc/headturbo-livekit/livekit.env   # LIVEKIT_KEYS="<api_key>: <api_secret>"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      # certificado do turn.brenoxavier.com.br que o Caddy emite e renova (TURN/TLS na 5349)
      - caddy-data:/caddy-data:ro
    mem_limit: 2g
    cpus: 1.5
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

  egress:
    image: livekit/egress:v1.15.0
    container_name: headturbo-livekit-egress
    labels:
      headturbo.kit: livekit
    restart: unless-stopped
    network_mode: host
    depends_on: [redis, livekit]
    cap_add:
      - SYS_ADMIN          # Chrome do RoomComposite
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - /etc/headturbo-livekit/egress.yaml:/etc/egress.yaml:ro
      - ./gravacoes:/out    # botão Gravar do estúdio (MP4)
    shm_size: 1g
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 3.0
    pids_limit: 2048
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

  # Vídeo da aula (URL_INPUT): lê o arquivo de headturbo-aulas (172.18.0.1:7890) e publica como participante.
  ingress:
    image: livekit/ingress:v1.5.0
    container_name: headturbo-livekit-ingress
    labels:
      headturbo.kit: livekit
    restart: unless-stopped
    network_mode: host
    depends_on: [redis, livekit]
    environment:
      INGRESS_CONFIG_FILE: /etc/ingress.yaml
    volumes:
      - /etc/headturbo-livekit/ingress.yaml:/etc/ingress.yaml:ro
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.5
    logging: { driver: json-file, options: { max-size: 10m, max-file: "5" } }

volumes:
  caddy-data:
    external: true
    # volume de dados do Caddy da stack /opt/head-turbo (confira: docker volume ls | grep caddy)
    name: ${CADDY_DATA_VOLUME:-head-turbo_caddy_data}

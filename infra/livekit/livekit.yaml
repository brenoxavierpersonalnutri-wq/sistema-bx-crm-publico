# LiveKit server (headturbo-livekit). Chaves vêm de LIVEKIT_KEYS em /etc/headturbo-livekit/livekit.env.
port: 7880
bind_addresses:
  - "0.0.0.0"          # ufw bloqueia 7880 de fora; o Caddy entra pelo gateway docker
logging:
  level: info

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true   # anuncia 203.0.113.10 nos candidatos ICE

redis:
  address: 127.0.0.1:6380

turn:
  enabled: true
  domain: turn.brenoxavier.com.br
  udp_port: 3478
  tls_port: 5349
  cert_file: /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/turn.brenoxavier.com.br/turn.brenoxavier.com.br.crt
  key_file: /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/turn.brenoxavier.com.br/turn.brenoxavier.com.br.key

room:
  empty_timeout: 600
  departure_timeout: 30
  max_participants: 20     # estúdio: produtor + convidados + render; público assiste por HLS

webhook:
  # nome da chave (não é segredo) — tem que ser o mesmo <api_key> de LIVEKIT_KEYS
  api_key: TROCAR_PELA_API_KEY
  urls:
    - https://SEU_PROJECT_REF.supabase.co/functions/v1/livekit-webhook

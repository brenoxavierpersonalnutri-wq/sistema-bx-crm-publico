### Publica as edge functions do Supabase a cada push na main.
#
# Sem isto, funcao de servidor so subia pelo painel do Lovable -- o repositorio
# guardava o codigo mas ninguem publicava. Correcao de webhook ficava semanas
# parada esperando alguem abrir o Lovable e colar um comando.
#
# Precisa do segredo SUPABASE_ACCESS_TOKEN no repositorio, criado em
# supabase.com/dashboard/account/tokens com a conta dona do projeto e colado
# em Settings > Secrets and variables > Actions.
#
# Sem o segredo, este fluxo FALHA. Ate aqui ele se marcava como sucesso e
# pulava tudo -- nove execucoes verdes seguidas em que nenhuma funcao foi
# publicada. Verde que nao publica nada e pior que vermelho: esconde que o
# codigo no repositorio e o codigo em producao sao coisas diferentes.

name: Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir se o acesso existe
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN nao esta configurado, entao NENHUMA funcao foi publicada. As funcoes em producao continuam na versao antiga, diferente do que esta no repositorio. Crie um token em https://supabase.com/dashboard/account/tokens e cole em Settings > Secrets and variables > Actions com o nome SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar as funcoes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref SEU_PROJECT_REF
